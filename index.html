<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fullpatrimonio</title>
  <meta name="description" content="Fullpatrimonio. Asesoría financiera integral. Sitio en construcción.">
  <!-- Mientras el sitio esté en construcción, se pide a los buscadores no indexarlo. Retirar al publicar. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Colores PROVISORIOS: reemplazar por los valores hex exactos de la guía visual de marca. */
    :root {
      --azul-patrimonial: #0b2a4a;
      --azul-pale: #e8eef5;
      --blanco: #ffffff;
      --texto: #1d2b3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Montserrat", system-ui, sans-serif;
      color: var(--texto);
      background: var(--azul-pale);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    main {
      background: var(--blanco);
      border-top: 6px solid var(--azul-patrimonial);
      max-width: 560px;
      width: 100%;
      padding: 48px 32px;
      text-align: center;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--azul-patrimonial);
      margin-bottom: 16px;
    }
    p { font-size: 1rem; line-height: 1.6; }
    .estado {
      margin-top: 24px;
      font-weight: 600;
      color: var(--azul-patrimonial);
    }
  </style>
</head>
<body>
  <main>
    <h1>Fullpatrimonio</h1>
    <p>Asesoría financiera integral, pensada para ti y tu familia.</p>
    <p class="estado">Estamos preparando este sitio. Vuelve pronto.</p>
  </main>
</body>
</html>
